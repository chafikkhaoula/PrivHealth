Organizations:
  - &PrivHealthOrderer
    Name: PrivHealthOrdererMSP
    ID: PrivHealthOrdererMSP
    MSPDir: organizations/ordererOrganizations/privhealth.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PrivHealthOrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('PrivHealthOrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('PrivHealthOrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.privhealth.local:7050

  - &Hospital1
    Name: Hospital1MSP
    ID: Hospital1MSP
    MSPDir: organizations/peerOrganizations/hospital1.privhealth.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Hospital1MSP.admin', 'Hospital1MSP.peer', 'Hospital1MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Hospital1MSP.admin', 'Hospital1MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Hospital1MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Hospital1MSP.peer')"
    AnchorPeers:
      - Host: peer0.hospital1.privhealth.local
        Port: 7051

  - &Hospital2
    Name: Hospital2MSP
    ID: Hospital2MSP
    MSPDir: organizations/peerOrganizations/hospital2.privhealth.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('Hospital2MSP.admin', 'Hospital2MSP.peer', 'Hospital2MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('Hospital2MSP.admin', 'Hospital2MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('Hospital2MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('Hospital2MSP.peer')"
    AnchorPeers:
      - Host: peer0.hospital2.privhealth.local
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.privhealth.local:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.privhealth.local
        Port: 7050
        ClientTLSCert: organizations/ordererOrganizations/privhealth.local/orderers/orderer.privhealth.local/tls/server.crt
        ServerTLSCert: organizations/ordererOrganizations/privhealth.local/orderers/orderer.privhealth.local/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  PrivHealthChannelGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *PrivHealthOrderer
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *Hospital1
        - *Hospital2
