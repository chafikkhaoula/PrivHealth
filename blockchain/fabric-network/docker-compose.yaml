services:
  orderer.privhealth.local:
    container_name: privhealth-orderer
    image: hyperledger/fabric-orderer:2.5.15
    labels:
      application: privhealth
      role: orderer
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=PrivHealthOrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
      - ORDERER_METRICS_PROVIDER=disabled
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/privhealth.local/orderers/orderer.privhealth.local/msp:/var/hyperledger/orderer/msp:ro
      - ./organizations/ordererOrganizations/privhealth.local/orderers/orderer.privhealth.local/tls:/var/hyperledger/orderer/tls:ro
      - privhealth_orderer_data:/var/hyperledger/production/orderer
    ports:
      - "17050:7050"
      - "17053:7053"
      - "19443:9443"
    networks:
      privhealth:
        aliases:
          - orderer.privhealth.local

  peer0.hospital1.privhealth.local:
    container_name: privhealth-peer0-hospital1
    image: hyperledger/fabric-peer:2.5.15
    labels:
      application: privhealth
      role: peer
      organization: hospital1
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.hospital1.privhealth.local
      - CORE_PEER_ADDRESS=peer0.hospital1.privhealth.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospital1.privhealth.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospital1.privhealth.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospital1.privhealth.local:7051
      - CORE_PEER_LOCALMSPID=Hospital1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
      - CORE_METRICS_PROVIDER=disabled
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=privhealth_fabric
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    working_dir: /root
    command: peer node start
    volumes:
      - ./runtime/config:/etc/hyperledger/peercfg:ro
      - ./organizations/peerOrganizations/hospital1.privhealth.local/peers/peer0.hospital1.privhealth.local:/etc/hyperledger/fabric:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - privhealth_peer0_hospital1_data:/var/hyperledger/production
    ports:
      - "17051:7051"
      - "19444:9444"
    networks:
      privhealth:
        aliases:
          - peer0.hospital1.privhealth.local

  peer0.hospital2.privhealth.local:
    container_name: privhealth-peer0-hospital2
    image: hyperledger/fabric-peer:2.5.15
    labels:
      application: privhealth
      role: peer
      organization: hospital2
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.hospital2.privhealth.local
      - CORE_PEER_ADDRESS=peer0.hospital2.privhealth.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospital2.privhealth.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospital2.privhealth.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospital2.privhealth.local:7051
      - CORE_PEER_LOCALMSPID=Hospital2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
      - CORE_METRICS_PROVIDER=disabled
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=privhealth_fabric
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    working_dir: /root
    command: peer node start
    volumes:
      - ./runtime/config:/etc/hyperledger/peercfg:ro
      - ./organizations/peerOrganizations/hospital2.privhealth.local/peers/peer0.hospital2.privhealth.local:/etc/hyperledger/fabric:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - privhealth_peer0_hospital2_data:/var/hyperledger/production
    ports:
      - "19051:7051"
      - "19445:9445"
    networks:
      privhealth:
        aliases:
          - peer0.hospital2.privhealth.local

networks:
  privhealth:
    name: privhealth_fabric

volumes:
  privhealth_orderer_data:
    name: privhealth_orderer_data
  privhealth_peer0_hospital1_data:
    name: privhealth_peer0_hospital1_data
  privhealth_peer0_hospital2_data:
    name: privhealth_peer0_hospital2_data
